<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        /* Dark Mode */
        html.dark body { background-color: #0f172a; color: #e2e8f0; }
        html.dark .bg-white { background-color: #1e293b; }
        html.dark .bg-slate-50 { background-color: #0f172a; }
        html.dark .text-slate-900 { color: #f8fafc; }
        html.dark .text-slate-600 { color: #94a3b8; }
        html.dark .border-slate-100, html.dark .border-slate-200 { border-color: #334155; }
        html.dark nav { background-color: rgba(30, 41, 59, 0.8); }

        /* Rich Text Content Styling */
        .prose h1 { font-size: 1.5em; font-weight: 700; margin-bottom: 0.75em; color: inherit; }
        .prose h2 { font-size: 1.25em; font-weight: 600; margin-bottom: 0.5em; color: inherit; }
        .prose p { margin-bottom: 1em; line-height: 1.75; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .prose strong { font-weight: 700; color: inherit; }
        .prose em { font-style: italic; }
        .prose a { color: #2563eb; text-decoration: underline; transition: color 0.2s; }
        .prose a:hover { color: #1d4ed8; }
        .prose img { max-width: 100%; height: auto; border-radius: 1rem; margin: 1.5rem 0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .prose blockquote { border-left: 4px solid #e2e8f0; padding-left: 1rem; font-style: italic; color: #64748b; margin: 1.5rem 0; }

        html.dark .prose blockquote { border-left-color: #475569; color: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-x-hidden selection:bg-blue-200 selection:text-blue-900 transition-colors duration-300">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-lg border-b border-slate-200/50 transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <!-- Logo -->
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-blue-500/30 group-hover:scale-105 transition-transform duration-300">
                        SD
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-lg leading-tight text-slate-900 group-hover:text-blue-600 transition-colors">SD INPRES LELINGLUAN</span>
                        <span class="text-[10px] uppercase tracking-widest text-slate-500 font-semibold">SISTEM PENERIMAAN MURID BARU</span>
                    </div>
                </a>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center gap-8">
                    <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition relative after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-0.5 after:bg-blue-600 after:transition-all hover:after:w-full">Beranda</a>
                    <a href="pengumuman.html" class="text-sm font-medium text-blue-600 font-semibold relative after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-full after:h-0.5 after:bg-blue-600">Pengumuman</a>
                </div>

                <!-- Right Actions -->
                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="p-2 rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
                        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    </button>
                    <!-- Mobile Menu Button -->
                    <button id="mobile-menu-btn" class="md:hidden p-2 text-slate-600 hover:text-blue-600 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-slate-100 shadow-lg absolute w-full left-0 top-20">
            <div class="px-4 pt-4 pb-6 space-y-3">
                <a href="index.html" class="block px-3 py-2 text-base font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg">Beranda</a>
                <a href="pengumuman.html" class="block px-3 py-2 text-base font-medium text-blue-600 bg-blue-50 rounded-lg">Pengumuman</a>
                <a href="login.html" class="block px-3 py-2 text-base font-medium text-slate-600 hover:bg-slate-50 hover:text-blue-600 rounded-lg">Login Admin</a>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative min-h-screen">
        <div class="text-center mb-16 fade-in-up visible">
            <h1 class="text-3xl font-bold text-slate-900 mb-4">Papan Pengumuman</h1>
            <div class="w-24 h-1.5 bg-blue-600 mx-auto rounded-full mb-6"></div>
            <p class="text-slate-600">Informasi terbaru seputar PPDB dan kegiatan sekolah.</p>
        </div>

        <div id="news-container" class="space-y-8">
            <!-- News Loaded via JS -->
            <div class="text-center py-20 text-slate-400 animate-pulse">Memuat pengumuman...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-12 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="border-t border-slate-100 pt-8 text-center text-sm text-slate-400">
                &copy; 2026 SD Inpres Lelingluan. Dibuat dengan 💖 oleh Edward Domakubun
            </div>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data, error } = await supabaseClient
                    .from('announcements')
                    .select('*')
                    .eq('is_published', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const container = document.getElementById('news-container');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-20 bg-white rounded-3xl shadow-sm border border-slate-100 fade-in-up visible">
                            <svg class="w-16 h-16 text-slate-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                            <p class="text-slate-500 font-medium">Belum ada pengumuman saat ini.</p>
                        </div>
                    `;
                    return;
                }

                data.forEach((item, index) => {
                    const date = new Date(item.created_at).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    // Animation delay staggered
                    const delay = index * 100;

                    const html = `
                        <article class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-xl hover:shadow-blue-500/10 transition-all duration-300 transform hover:-translate-y-1 fade-in-up visible" style="transition-delay: ${delay}ms;">
                            <div class="p-8 md:p-10">
                                <div class="flex items-center gap-2 text-sm text-blue-600 font-semibold mb-4 bg-blue-50 w-fit px-3 py-1 rounded-full">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${date}
                                </div>
                                <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-6">${item.title}</h2>
                                <div class="prose prose-blue prose-lg max-w-none text-slate-600">
                                    ${item.content}
                                </div>
                            </div>
                        </article>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('news-container').innerHTML = '<div class="text-center text-red-500 p-4 bg-red-50 rounded-xl">Gagal memuat berita. Silakan coba lagi nanti.</div>';
            }
        });
    </script>
</body>
</html>
