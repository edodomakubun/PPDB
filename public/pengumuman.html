<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Rich Text Content Styling */
        .prose h1 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; }
        .prose h2 { font-size: 1.25em; font-weight: bold; margin-bottom: 0.5em; }
        .prose p { margin-bottom: 1em; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .prose strong { font-weight: 700; }
        .prose em { font-style: italic; }
        .prose a { color: #2563eb; text-decoration: underline; }
        .prose img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1rem 0; }
        .prose blockquote { border-left: 4px solid #e5e7eb; padding-left: 1rem; font-style: italic; color: #4b5563; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">SD</div>
                    <a href="index.html" class="font-bold text-xl tracking-tight text-blue-900">SD INPRES LELINGLUAN</a>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-slate-600 hover:text-blue-600 font-medium transition">Beranda</a>
                    <a href="pengumuman.html" class="text-blue-600 font-medium transition">Pengumuman</a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="daftar.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full font-semibold transition shadow-md">
                        Daftar Sekarang
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-12">
            <h1 class="text-3xl font-bold text-slate-900 mb-4">Papan Pengumuman</h1>
            <p class="text-slate-600">Informasi terbaru seputar PPDB dan kegiatan sekolah.</p>
        </div>

        <div id="news-container" class="space-y-8">
            <!-- News Loaded via JS -->
            <div class="text-center py-20 text-slate-400">Memuat pengumuman...</div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data, error } = await supabaseClient
                    .from('announcements')
                    .select('*')
                    .eq('is_published', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const container = document.getElementById('news-container');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-20 bg-white rounded-2xl shadow-sm border border-slate-100">
                            <svg class="w-16 h-16 text-slate-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                            <p class="text-slate-500">Belum ada pengumuman saat ini.</p>
                        </div>
                    `;
                    return;
                }

                data.forEach(item => {
                    const date = new Date(item.created_at).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    const html = `
                        <article class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition">
                            <div class="p-8">
                                <div class="flex items-center gap-2 text-sm text-slate-500 mb-3">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${date}
                                </div>
                                <h2 class="text-2xl font-bold text-slate-900 mb-4">${item.title}</h2>
                                <div class="prose prose-blue text-slate-600">
                                    ${item.content}
                                </div>
                            </div>
                        </article>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('news-container').innerHTML = '<div class="text-center text-red-500">Gagal memuat berita.</div>';
            }
        });
    </script>
</body>
</html>
