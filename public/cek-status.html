<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status Pendaftaran - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="flex-shrink-0 flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">SD</div>
                    <span class="font-bold text-xl tracking-tight text-blue-900">SD INPRES LELINGLUAN</span>
                </a>
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-slate-600 hover:text-blue-600 font-medium text-sm">Kembali ke Beranda</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-28 pb-20 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md mx-auto">

            <div class="text-center mb-10">
                <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Cek Status Kelulusan</h1>
                <p class="text-slate-600">Masukkan NIK atau Kode Pendaftaran Anda untuk melihat hasil seleksi.</p>
            </div>

            <!-- Search Form -->
            <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8 mb-8">
                <form id="form-cek" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">NIK Siswa</label>
                        <input type="text" id="nik-input" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-center text-lg tracking-wide font-mono placeholder:font-sans" placeholder="Masukkan 16 digit NIK">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        Cek Status
                    </button>
                </form>
            </div>

            <!-- Result Area -->
            <div id="result-area" class="hidden">
                <!-- Content injected via JS -->
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-300 py-8 text-center mt-auto">
        <div class="max-w-7xl mx-auto px-4">
            <p>&copy; 2024 SD Inpres Lelingluan. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/cek-status.js"></script>
</body>
</html>
