<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Galeri - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900 flex h-screen overflow-hidden">

    <!-- Dynamic Sidebar Container -->
    <div id="sidebar-container" class="shrink-0"></div>

    <!-- Main Content Panel -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto pt-16 md:pt-0">
        
        <!-- Header / Top Bar -->
        <header class="bg-white border-b border-slate-200 py-6 px-8 hidden md:flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Galeri Sekolah</h1>
                <p class="text-slate-500 text-xs mt-1">Upload foto kegiatan sekolah untuk ditampilkan di halaman depan.</p>
            </div>
        </header>

        <!-- Dynamic Global Admin Announcement Container -->
        <div id="announcement-banner-root" class="max-w-7xl mx-auto px-8 mt-6 w-full hidden"></div>

        <!-- Main Content -->
        <main class="max-w-6xl mx-auto px-8 py-8 w-full">
        <div class="mb-8 flex justify-between items-center">
            <div>
                <a href="dashboard.html" class="text-slate-500 hover:text-blue-600 text-sm mb-2 inline-flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali ke Dashboard
                </a>
                <h1 class="text-2xl font-bold text-slate-900">Galeri Sekolah</h1>
                <p class="text-slate-500">Upload foto kegiatan sekolah untuk ditampilkan di halaman depan.</p>
            </div>
            <button onclick="document.getElementById('file-upload').click()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-sm transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Upload Foto Baru
            </button>
            <input type="file" id="file-upload" class="hidden" accept="image/*" multiple>
        </div>

        <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Images Loaded JS -->
            <div class="col-span-full py-12 text-center text-slate-400">Memuat galeri...</div>
        </div>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/admin-gallery.js"></script>
</body>
</html>
