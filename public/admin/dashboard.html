<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow-x: hidden; overflow-y: hidden !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900 flex h-screen overflow-hidden">

    <!-- Dynamic Sidebar Container -->
    <div id="sidebar-container" class="shrink-0"></div>

    <!-- Main Content Panel -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto pt-16 md:pt-0">
        
        <!-- Header / Top Bar -->
        <header class="bg-white border-b border-slate-200 py-6 px-8 hidden md:flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Dashboard PPDB</h1>
                <p class="text-slate-500 text-xs mt-1">Selamat datang kembali! Pantau dan kelola data pendaftaran siswa baru.</p>
            </div>
        </header>

        <!-- Dynamic Global Admin Announcement Container -->
        <div id="announcement-banner-root" class="max-w-7xl mx-auto px-8 mt-6 w-full hidden"></div>

        <!-- Dashboard Content Body -->
        <main class="max-w-7xl mx-auto px-8 py-8 w-full">

            <!-- Statistics Section -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition">
                    <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Total Pendaftar</div>
                    <div class="text-3xl font-black text-slate-900 mt-2" id="stat-total">0</div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition">
                    <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Diterima</div>
                    <div class="text-3xl font-black text-green-600 mt-2" id="stat-accepted">0</div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition">
                    <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Ditolak</div>
                    <div class="text-3xl font-black text-red-600 mt-2" id="stat-rejected">0</div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition">
                    <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Menunggu</div>
                    <div class="text-3xl font-black text-yellow-600 mt-2" id="stat-pending">0</div>
                </div>
            </div>

            <!-- Charts & Controls Row -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                <!-- Charts Area -->
                <div class="lg:col-span-2 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-slate-900 mb-6">Statistik Pendaftaran</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="h-60 flex justify-center">
                            <canvas id="statusChart"></canvas>
                        </div>
                        <div class="h-60 flex justify-center">
                            <canvas id="genderChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Settings Area -->
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-slate-900 mb-6">Status Pendaftaran</h3>

                    <div class="mb-4">
                        <div class="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <span id="status-label" class="text-sm font-bold text-green-600 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                Buka
                            </span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="toggle-registration" class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-100 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                            </label>
                        </div>
                        <p class="text-xs text-slate-500 mt-2 leading-relaxed">Jika dimatikan, form pendaftaran tidak akan muncul di halaman publik.</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
