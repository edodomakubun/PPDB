<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurasi Website - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">SD</div>
                    <span class="font-bold text-lg text-slate-900">Panel Panitia</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-email" class="text-sm text-slate-500 hidden sm:block"></span>
                    <a href="dashboard.html" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition">Dashboard</a>
                    <button id="btn-logout" class="text-sm font-medium text-red-600 hover:text-red-700 transition">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <a href="dashboard.html" class="text-slate-500 hover:text-blue-600 text-sm mb-2 inline-flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali ke Dashboard
            </a>
            <h1 class="text-2xl font-bold text-slate-900">Konfigurasi Website & PDF</h1>
            <p class="text-slate-500">Atur informasi sekolah yang akan tampil di website dan dokumen PDF.</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 sm:p-8">
                <form id="form-settings" class="space-y-6">

                    <!-- Logo URL -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">URL Logo Sekolah</label>
                        <input type="url" id="logo_url" name="logo_url" placeholder="https://example.com/logo.png" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        <p class="text-xs text-slate-500 mt-1">Tempel tautan gambar logo (format .png atau .jpg). Gunakan hosting gambar gratis jika perlu.</p>
                    </div>

                    <!-- Nama Sekolah -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Sekolah</label>
                        <input type="text" id="nama_sekolah" name="nama_sekolah" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <!-- Alamat Sekolah -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Alamat Sekolah</label>
                        <textarea id="alamat" name="alamat" rows="3" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"></textarea>
                    </div>

                    <!-- Kepala Sekolah -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Kepala Sekolah</label>
                        <input type="text" id="kepala_sekolah" name="kepala_sekolah" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-6 border-t border-slate-100 flex justify-end">
                        <button type="submit" id="btn-save" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold shadow-md transition transform hover:-translate-y-0.5">
                            Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check Auth
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = '../login.html';

            // Load Settings
            loadSettings();

            // Handle Submit
            document.getElementById('form-settings').addEventListener('submit', saveSettings);
        });

        async function loadSettings() {
            try {
                const { data, error } = await supabaseClient
                    .from('app_settings')
                    .select('value')
                    .eq('key', 'school_profile')
                    .single();

                if (data && data.value) {
                    const settings = typeof data.value === 'string' ? JSON.parse(data.value) : data.value;
                    document.getElementById('logo_url').value = settings.logo_url || '';
                    document.getElementById('nama_sekolah').value = settings.nama_sekolah || '';
                    document.getElementById('alamat').value = settings.alamat || '';
                    document.getElementById('kepala_sekolah').value = settings.kepala_sekolah || '';
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Gagal memuat pengaturan.', 'error');
            }
        }

        async function saveSettings(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const settings = {
                logo_url: formData.get('logo_url'),
                nama_sekolah: formData.get('nama_sekolah'),
                alamat: formData.get('alamat'),
                kepala_sekolah: formData.get('kepala_sekolah')
            };

            try {
                Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });

                const { error } = await supabaseClient
                    .from('app_settings')
                    .upsert({
                        key: 'school_profile',
                        value: settings
                    });

                if (error) throw error;

                await logActivity('UPDATE_SETTINGS', 'Memperbarui konfigurasi website sekolah');

                Swal.fire('Berhasil', 'Pengaturan berhasil disimpan.', 'success');

            } catch (err) {
                console.error(err);
                Swal.fire('Gagal', err.message, 'error');
            }
        }
    </script>
</body>
</html>
