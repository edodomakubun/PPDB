<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Siswa - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body
    class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900 flex h-screen overflow-hidden">

    <!-- Dynamic Sidebar Container -->
    <div id="sidebar-container" class="shrink-0"></div>

    <!-- Main Content Panel -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto pt-16 md:pt-0">

        <!-- Header / Top Bar -->
        <header
            class="bg-white border-b border-slate-200 py-6 px-8 hidden md:flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Detail Pendaftar</h1>
                <p class="text-slate-500 text-xs mt-1">Detail informasi pendaftaran dan verifikasi siswa baru.</p>
            </div>
        </header>

        <!-- Dynamic Global Admin Announcement Container -->
        <div id="announcement-banner-root" class="max-w-7xl mx-auto px-8 mt-6 w-full hidden"></div>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-8 py-8 w-full">

            <!-- Header & Actions -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                <div>
                    <a href="daftar-siswa.html"
                        class="text-slate-500 hover:text-blue-600 text-sm mb-2 inline-flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                        Kembali ke Daftar Siswa
                    </a>
                    <h1 class="text-2xl font-bold text-slate-900">Detail Pendaftar</h1>
                </div>
                <div class="flex gap-2">
                    <a href="#" id="btn-print" target="_blank"
                        class="inline-flex items-center px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-medium transition shadow-sm text-sm">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z">
                            </path>
                        </svg>
                        Cetak Kartu
                    </a>
                    <button id="btn-edit-toggle"
                        class="inline-flex items-center px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg font-medium transition shadow-sm text-sm">
                        Edit Data
                    </button>
                    <button id="btn-delete"
                        class="inline-flex items-center px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg font-medium transition shadow-sm text-sm">
                        Hapus
                    </button>
                </div>
            </div>

            <!-- Detail Card -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 sm:p-8">
                    <div id="loading-indicator" class="text-center py-10">
                        <p class="text-slate-500">Memuat data siswa...</p>
                    </div>

                    <form id="form-edit" class="hidden">
                        <div id="detail-content" class="space-y-8">
                            <!-- Content injected via JS -->
                        </div>

                        <!-- Action Buttons Footer -->
                        <div class="mt-8 pt-6 border-t border-slate-100 flex flex-col sm:flex-row gap-3 justify-end">

                            <!-- Edit Mode Actions -->
                            <div id="edit-actions" class="hidden w-full sm:w-auto flex flex-col sm:flex-row gap-3">
                                <button type="button" id="btn-cancel-edit"
                                    class="w-full sm:w-auto px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg font-medium hover:bg-slate-50">
                                    Batal
                                </button>
                                <button type="button" id="btn-save-edit"
                                    class="w-full sm:w-auto px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 shadow-sm">
                                    Simpan Perubahan
                                </button>
                            </div>

                            <!-- Status Actions -->
                            <div id="status-actions" class="w-full sm:w-auto flex flex-col sm:flex-row gap-3">
                                <button type="button" id="btn-accept"
                                    class="w-full sm:w-auto px-4 py-2 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 shadow-sm">
                                    Terima Siswa
                                </button>
                                <button type="button" id="btn-reject"
                                    class="w-full sm:w-auto px-4 py-2 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 shadow-sm">
                                    Tolak
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/ocr.js"></script>
    <script src="../js/admin-detail.js"></script>
</body>

</html>
