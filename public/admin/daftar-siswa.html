<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pendaftar Siswa - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900 flex h-screen overflow-hidden">

    <!-- Sidebar Container -->
    <div id="sidebar-container" class="shrink-0"></div>

    <!-- Main Content Panel -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto pt-16 md:pt-0">
        
        <!-- Header / Top Bar -->
        <header class="bg-white border-b border-slate-200 py-6 px-8 hidden md:flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Kelola Pendaftaran Siswa</h1>
                <p class="text-slate-500 text-xs mt-1">Kelola, saring, verifikasi, dan ekspor data pendaftaran siswa baru.</p>
            </div>
        </header>

        <!-- Dynamic Global Admin Announcement Container -->
        <div id="announcement-banner-root" class="max-w-7xl mx-auto px-8 mt-6 w-full hidden"></div>

        <!-- Content Body -->
        <main class="max-w-7xl mx-auto px-8 py-8 w-full">

            <!-- Header & Actions -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Daftar Pendaftar</h2>
                    <p class="text-slate-500 text-sm mt-1">Gunakan tombol di sebelah kanan untuk mengekspor atau menambah data manual.</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <div class="relative inline-block text-left">
                        <button id="btn-export-dropdown" class="inline-flex items-center px-5 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-xl font-semibold transition shadow-md shadow-green-500/20 text-sm cursor-pointer">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <span>Export Laporan</span>
                            <svg class="w-4 h-4 ml-2 -mr-1 transition-transform duration-200" id="icon-export-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <!-- Dropdown -->
                        <div id="export-dropdown-menu" class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl py-2 hidden border border-slate-100 z-50 transition-all duration-200 transform origin-top-right scale-95 opacity-0">
                            <button onclick="exportToExcel()" class="block w-full text-left px-5 py-2.5 text-sm text-slate-700 hover:bg-slate-50 transition cursor-pointer">Download Excel (.xlsx)</button>
                            <button onclick="exportToPDF()" class="block w-full text-left px-5 py-2.5 text-sm text-slate-700 hover:bg-slate-50 transition cursor-pointer">Download PDF</button>
                            <div class="border-t border-slate-100 my-1"></div>
                            <button onclick="exportToJSON()" class="block w-full text-left px-5 py-2.5 text-sm text-red-600 hover:bg-red-50 transition font-medium cursor-pointer">Backup Data (JSON)</button>
                        </div>
                    </div>

                    <a href="tambah-siswa.html" class="inline-flex items-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold transition shadow-md shadow-blue-500/30 text-sm">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Tambah Manual
                    </a>
                    <button onclick="loadData()" class="inline-flex items-center px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl font-semibold transition shadow-sm text-sm">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Refresh
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-8 flex flex-col sm:flex-row gap-4 flex-wrap items-center">
                <div class="relative flex-1 min-w-[200px] w-full sm:w-auto">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="search-input" placeholder="Cari nama atau NIK..." class="pl-10 w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition bg-slate-50 focus:bg-white">
                </div>

                <input type="text" id="school-filter" placeholder="Asal Sekolah..." class="px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm min-w-[150px] bg-slate-50 focus:bg-white transition">

                <select id="status-filter" class="px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-slate-50 focus:bg-white transition cursor-pointer">
                    <option value="all">Semua Status</option>
                    <option value="Menunggu Verifikasi">Menunggu Verifikasi</option>
                    <option value="Diterima">Diterima</option>
                    <option value="Ditolak">Ditolak</option>
                </select>

                <input type="date" id="date-filter" class="px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-500 bg-slate-50 focus:bg-white transition cursor-pointer">
                <button onclick="resetFilters()" class="px-5 py-2.5 text-sm text-red-600 hover:text-red-700 bg-red-50 hover:bg-red-100 rounded-xl font-semibold transition cursor-pointer">Reset</button>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-8">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-slate-100" id="data-table">
                        <thead class="bg-slate-50/50">
                            <tr>
                                <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Tanggal</th>
                                <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Nama Siswa / NIK</th>
                                <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Orang Tua</th>
                                <th scope="col" class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Status</th>
                                <th scope="col" class="px-6 py-4 text-right text-xs font-bold text-slate-500 uppercase tracking-wider">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="bg-white divide-y divide-slate-100">
                            <tr>
                                <td colspan="5" class="px-6 py-12 text-center text-slate-400 font-medium">Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Count -->
                <div class="px-6 py-4 border-t border-slate-100 bg-slate-50/50 text-right">
                    <span class="text-xs font-semibold text-slate-500" id="data-count">Total: 0 Pendaftar</span>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/admin-daftar-siswa.js"></script>
</body>
</html>
