<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pengumuman - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">SD</div>
                    <span class="font-bold text-lg text-slate-900">Panel Panitia</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-email" class="text-sm text-slate-500 hidden sm:block"></span>
                    <a href="dashboard.html" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition">Dashboard</a>
                    <button id="btn-logout" class="text-sm font-medium text-red-600 hover:text-red-700 transition">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex justify-between items-center">
            <div>
                <a href="dashboard.html" class="text-slate-500 hover:text-blue-600 text-sm mb-2 inline-flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Kembali ke Dashboard
                </a>
                <h1 class="text-2xl font-bold text-slate-900">Kelola Pengumuman</h1>
                <p class="text-slate-500">Buat dan kelola berita atau informasi untuk halaman publik.</p>
            </div>
            <button onclick="openModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-sm transition">
                + Buat Pengumuman
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Tanggal</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Judul</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="news-body" class="bg-white divide-y divide-slate-200">
                        <tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="modal-news" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-slate-500 bg-opacity-75 transition-opacity" onclick="closeModal()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-bold text-slate-900 mb-4" id="modal-title">Buat Pengumuman</h3>
                    <form id="form-news" class="space-y-4">
                        <input type="hidden" id="news-id">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Judul Pengumuman</label>
                            <input type="text" id="news-title" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Isi Konten</label>
                            <textarea id="news-content" rows="6" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="news-published" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            <label for="news-published" class="ml-2 block text-sm text-slate-900">Publikasikan Langsung</label>
                        </div>
                    </form>
                </div>
                <div class="bg-slate-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse gap-2">
                    <button type="button" onclick="saveNews()" class="w-full inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:w-auto sm:text-sm">
                        Simpan
                    </button>
                    <button type="button" onclick="closeModal()" class="w-full inline-flex justify-center rounded-lg border border-slate-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-slate-700 hover:text-slate-500 focus:outline-none sm:w-auto sm:text-sm">
                        Batal
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = '../login.html';
            document.getElementById('user-email').innerText = session.user.email;
            document.getElementById('btn-logout').addEventListener('click', async () => {
                await supabaseClient.auth.signOut();
                window.location.href = '../login.html';
            });
            loadNews();
        });

        async function loadNews() {
            try {
                const { data, error } = await supabaseClient
                    .from('announcements')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                renderTable(data);
            } catch (err) {
                console.error(err);
                document.getElementById('news-body').innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-red-500">Gagal.</td></tr>';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('news-body');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">Belum ada pengumuman.</td></tr>';
                return;
            }
            data.forEach(item => {
                const date = new Date(item.created_at).toLocaleDateString('id-ID');
                const statusBadge = item.is_published
                    ? '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Published</span>'
                    : '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">Draft</span>';

                // Escape simple quotes for onclick
                const safeTitle = item.title.replace(/'/g, "\\'");
                const safeContent = item.content.replace(/'/g, "\\'").replace(/\n/g, "\\n");

                const row = `
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${date}</td>
                        <td class="px-6 py-4 text-sm text-slate-900 font-medium">${item.title}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${statusBadge}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="editNews('${item.id}', '${safeTitle}', '${safeContent}', ${item.is_published})" class="text-blue-600 hover:text-blue-900 mr-3">Edit</button>
                            <button onclick="deleteNews('${item.id}')" class="text-red-600 hover:text-red-900">Hapus</button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        function openModal() {
            document.getElementById('modal-news').classList.remove('hidden');
            document.getElementById('form-news').reset();
            document.getElementById('news-id').value = '';
            document.getElementById('modal-title').innerText = 'Buat Pengumuman';
        }

        function closeModal() {
            document.getElementById('modal-news').classList.add('hidden');
        }

        function editNews(id, title, content, published) {
            document.getElementById('modal-news').classList.remove('hidden');
            document.getElementById('modal-title').innerText = 'Edit Pengumuman';
            document.getElementById('news-id').value = id;
            document.getElementById('news-title').value = title;
            document.getElementById('news-content').value = content;
            document.getElementById('news-published').checked = published;
        }

        async function saveNews() {
            const id = document.getElementById('news-id').value;
            const title = document.getElementById('news-title').value;
            const content = document.getElementById('news-content').value;
            const is_published = document.getElementById('news-published').checked;

            if (!title || !content) return Swal.fire('Error', 'Judul dan konten wajib diisi', 'error');

            try {
                Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });

                const payload = { title, content, is_published };
                let error;

                if (id) {
                    ({ error } = await supabaseClient.from('announcements').update(payload).eq('id', id));
                } else {
                    ({ error } = await supabaseClient.from('announcements').insert([payload]));
                }

                if (error) throw error;

                await logActivity(id ? 'UPDATE_NEWS' : 'CREATE_NEWS', `Menyimpan pengumuman: ${title}`);

                Swal.fire('Berhasil', 'Pengumuman tersimpan.', 'success');
                closeModal();
                loadNews();

            } catch (err) {
                Swal.fire('Gagal', err.message, 'error');
            }
        }

        async function deleteNews(id) {
            const result = await Swal.fire({
                title: 'Hapus?',
                text: "Pengumuman akan dihapus permanen.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, Hapus'
            });

            if (result.isConfirmed) {
                try {
                    const { error } = await supabaseClient.from('announcements').delete().eq('id', id);
                    if (error) throw error;

                    await logActivity('DELETE_NEWS', `Menghapus pengumuman ID: ${id}`);
                    loadNews();
                } catch (err) {
                    Swal.fire('Error', err.message, 'error');
                }
            }
        }
    </script>
</body>
</html>
