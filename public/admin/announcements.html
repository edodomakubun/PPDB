<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pengumuman - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900 flex h-screen overflow-hidden">

    <!-- Dynamic Sidebar Container -->
    <div id="sidebar-container" class="shrink-0"></div>

    <!-- Main Content Panel -->
    <div class="flex-1 flex flex-col h-screen overflow-y-auto pt-16 md:pt-0">
        
        <!-- Header / Top Bar -->
        <header class="bg-white border-b border-slate-200 py-6 px-8 hidden md:flex justify-between items-center shrink-0">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Kelola Pengumuman</h1>
                <p class="text-slate-500 text-xs mt-1">Buat dan kelola berita atau informasi untuk halaman publik.</p>
            </div>
        </header>

        <!-- Dynamic Global Admin Announcement Container -->
        <div id="announcement-banner-root" class="max-w-7xl mx-auto px-8 mt-6 w-full hidden"></div>

        <!-- Main Content -->
        <main class="max-w-5xl mx-auto px-8 py-8 w-full">
            <div class="mb-8 flex justify-between items-center">
                <div>
                    <a href="dashboard.html" class="text-slate-500 hover:text-blue-600 text-sm mb-2 inline-flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Kembali ke Dashboard
                    </a>
                    <h1 class="text-2xl font-bold text-slate-900">Kelola Pengumuman</h1>
                    <p class="text-slate-500 text-sm mt-1">Buat dan kelola berita atau informasi untuk halaman publik.</p>
                </div>
                <button onclick="openModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-sm transition">
                    + Buat Pengumuman
                </button>
            </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Tanggal</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Judul</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="news-body" class="bg-white divide-y divide-slate-200">
                        <tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal-news" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closeModal()"></div>

        <!-- Modal Panel Container -->
        <div class="fixed inset-0 z-50 overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">

                <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-2xl">
                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <h3 class="text-lg font-bold leading-6 text-gray-900 mb-4" id="modal-title">Buat Pengumuman</h3>
                        <form id="form-news" class="space-y-4">
                            <input type="hidden" id="news-id">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Judul Pengumuman</label>
                                <input type="text" id="news-title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none transition">
                            </div>
                            <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-sm font-medium text-gray-700">Isi Konten</label>
                                <button type="button" onclick="toggleSourceView()" class="text-xs text-blue-600 hover:underline font-medium">
                                    &lt;&gt; Edit Source Code
                                </button>
                            </div>

                            <div class="bg-white relative">
                                <div id="editor-container" class="h-64 border border-gray-300 rounded-b-lg"></div>
                                <textarea id="source-editor" class="hidden w-full h-64 p-2 border border-gray-300 rounded-b-lg font-mono text-xs bg-slate-50 focus:outline-none" placeholder="<!-- Masukkan HTML Custom di sini -->"></textarea>
                            </div>
                            <input type="hidden" id="news-content">
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" id="news-published" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <label for="news-published" class="ml-2 block text-sm text-gray-900">Publikasikan Langsung</label>
                            </div>
                        </form>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 gap-2">
                        <button type="button" onclick="saveNews()" class="inline-flex w-full justify-center rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 sm:w-auto">Simpan</button>
                        <button type="button" onclick="closeModal()" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">Batal</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script>
        let quill;
        let isSourceView = false;

        function toggleSourceView() {
            const editorDiv = document.getElementById('editor-container').parentElement; // Parent .bg-white
            const quillContainer = document.getElementById('editor-container');
            const sourceTextarea = document.getElementById('source-editor');
            const toolbar = editorDiv.querySelector('.ql-toolbar'); // Quill toolbar is sibling

            isSourceView = !isSourceView;

            if (isSourceView) {
                // Switch to Source
                sourceTextarea.value = quill.root.innerHTML;
                quillContainer.classList.add('hidden');
                if(toolbar) toolbar.classList.add('hidden');
                sourceTextarea.classList.remove('hidden');
            } else {
                // Switch to WYSIWYG
                quill.clipboard.dangerouslyPasteHTML(sourceTextarea.value);
                sourceTextarea.classList.add('hidden');
                quillContainer.classList.remove('hidden');
                if(toolbar) toolbar.classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize Quill
            quill = new Quill('#editor-container', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'align': [] }],
                        ['link', 'image', 'clean']
                    ]
                }
            });

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = '../login.html';
                return;
            }
            loadNews();
        });

        async function loadNews() {
            try {
                const { data, error } = await supabaseClient
                    .from('announcements')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                renderTable(data);
            } catch (err) {
                console.error(err);
                document.getElementById('news-body').innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-red-500">Gagal.</td></tr>';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('news-body');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-slate-500">Belum ada pengumuman.</td></tr>';
                return;
            }
            data.forEach(item => {
                const date = new Date(item.created_at).toLocaleDateString('id-ID');
                const statusBadge = item.is_published
                    ? '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Published</span>'
                    : '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">Draft</span>';

                const row = `
                    <tr class="hover:bg-slate-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${date}</td>
                        <td class="px-6 py-4 text-sm text-slate-900 font-medium">${item.title}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${statusBadge}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="editNews('${item.id}')" class="text-blue-600 hover:text-blue-900 mr-3">Edit</button>
                            <button onclick="deleteNews('${item.id}')" class="text-red-600 hover:text-red-900">Hapus</button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        function openModal() {
            document.getElementById('modal-news').classList.remove('hidden');
            document.getElementById('form-news').reset();
            document.getElementById('news-id').value = '';
            quill.root.innerHTML = ''; // Reset editor

            // Reset source view if active
            if(isSourceView) toggleSourceView();

            document.getElementById('modal-title').innerText = 'Buat Pengumuman';
        }

        function closeModal() {
            document.getElementById('modal-news').classList.add('hidden');
        }

        function editNews(id) {
            document.getElementById('modal-news').classList.remove('hidden');
            document.getElementById('modal-title').innerText = 'Edit Pengumuman';
            document.getElementById('form-news').reset(); // Clear previous
            document.getElementById('news-id').value = id;
            quill.root.innerHTML = 'Loading...';

            // Reset source view if active
            if(isSourceView) toggleSourceView();

            fetchSingleNews(id);
        }

        async function fetchSingleNews(id) {
            Swal.fire({ title: 'Memuat...', didOpen: () => Swal.showLoading() });
            const { data, error } = await supabaseClient.from('announcements').select('*').eq('id', id).single();
            Swal.close();

            if (data) {
                document.getElementById('news-id').value = data.id;
                document.getElementById('news-title').value = data.title;
                quill.root.innerHTML = data.content; // Set editor content
                document.getElementById('news-published').checked = data.is_published;
            }
        }

        async function saveNews() {
            const id = document.getElementById('news-id').value;
            const title = document.getElementById('news-title').value;

            // Get content from appropriate source
            let content = '';
            if (isSourceView) {
                content = document.getElementById('source-editor').value;
            } else {
                content = quill.root.innerHTML;
            }

            const is_published = document.getElementById('news-published').checked;

            // Check empty content
            if (!title || (!content || content === '<p><br></p>')) return Swal.fire('Error', 'Judul dan konten wajib diisi', 'error');

            try {
                Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });

                const payload = { title, content, is_published };
                let error;

                if (id) {
                    ({ error } = await supabaseClient.from('announcements').update(payload).eq('id', id));
                } else {
                    ({ error } = await supabaseClient.from('announcements').insert([payload]));
                }

                if (error) throw error;

                await logActivity(id ? 'UPDATE_NEWS' : 'CREATE_NEWS', `Menyimpan pengumuman: ${title}`);

                Swal.fire('Berhasil', 'Pengumuman tersimpan.', 'success');
                closeModal();
                loadNews();

            } catch (err) {
                Swal.fire('Gagal', err.message, 'error');
            }
        }

        async function deleteNews(id) {
            const result = await Swal.fire({
                title: 'Hapus?',
                text: "Pengumuman akan dihapus permanen.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, Hapus'
            });

            if (result.isConfirmed) {
                try {
                    const { error } = await supabaseClient.from('announcements').delete().eq('id', id);
                    if (error) throw error;

                    await logActivity('DELETE_NEWS', `Menghapus pengumuman ID: ${id}`);
                    loadNews();
                } catch (err) {
                    Swal.fire('Error', err.message, 'error');
                }
            }
        }
    </script>
</body>
</html>
