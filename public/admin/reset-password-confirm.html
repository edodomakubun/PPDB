<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>body { font-family: sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-lg border border-slate-200 w-full max-w-md text-center">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6 text-blue-600">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>

        <h2 class="text-2xl font-bold text-slate-900 mb-2">Atur Ulang Password</h2>
        <p class="text-slate-500 mb-6">Masukkan password baru untuk akun Anda.</p>

        <form id="form-reset" class="space-y-4">
            <input type="password" id="new-password" placeholder="Password Baru (Min 6 karakter)" required minlength="6" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition shadow-md">
                Simpan Password Baru
            </button>
        </form>
    </div>

    <script src="../js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check for hash fragment from Supabase redirect (contains access_token)
            // Supabase auth helper automatically handles session recovery if present.

            const { data: { session }, error } = await supabaseClient.auth.getSession();

            if (!session) {
                // If no session, the link might be invalid or expired.
                Swal.fire({
                    icon: 'error',
                    title: 'Link Tidak Valid',
                    text: 'Tautan reset password mungkin sudah kadaluarsa atau tidak valid.',
                    confirmButtonText: 'Kembali ke Login'
                }).then(() => {
                    window.location.href = '../login.html';
                });
            }

            document.getElementById('form-reset').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;

                if (newPassword.length < 6) {
                    return Swal.fire('Error', 'Password minimal 6 karakter.', 'error');
                }

                try {
                    Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });

                    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
                    if (error) throw error;

                    await Swal.fire('Berhasil!', 'Password Anda telah diperbarui. Silakan login.', 'success');
                    window.location.href = '../login.html';

                } catch (err) {
                    Swal.fire('Gagal', err.message, 'error');
                }
            });
        });
    </script>
</body>
</html>
