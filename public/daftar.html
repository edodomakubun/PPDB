    <main class="pt-28 pb-20 px-4 sm:px-6 lg:px-8 relative">

        <div class="max-w-3xl mx-auto fade-in-up visible">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Formulir Pendaftaran</h1>
                <p class="text-slate-500">Lengkapi data di bawah ini dengan benar dan sesuai dokumen asli.</p>
            </div>

            <form id="form-daftar" class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-xl border border-slate-100 overflow-hidden relative">

                <!-- Section 1: Identity -->
                <div class="p-8 border-b border-slate-100">
                    <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-3">
                        <span class="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center text-sm font-bold shadow-lg shadow-blue-500/30">1</span>

                    </h2>
                    <div id="section-identity" class="space-y-5">
                        <!-- Dynamic Content Rendered Here -->
                        <div class="animate-pulse space-y-4">
                            <div class="h-10 bg-slate-100 rounded w-full"></div>
                            <div class="h-10 bg-slate-100 rounded w-full"></div>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Parents -->
                <div class="p-8 border-b border-slate-100 bg-slate-50/50">
                    <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-3">
                        <span class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center text-sm font-bold shadow-lg shadow-indigo-500/30">2</span>
                        Data Orang Tua / Wali

                    <div id="section-parents" class="space-y-5">

                    </div>
                </div>

                <!-- Section 3: Files -->

                        Berkas Lampiran
                    </h2>
                    <div id="section-files" class="space-y-5">
                        <!-- Dynamic Content Rendered Here -->
                    </div>
                </div>

                <!-- Section 4: Custom/Additional -->
                <div class="p-8 border-b border-slate-100 bg-slate-50/50">
                    <div id="section-custom" class="space-y-5">
                        <!-- Dynamic Content Rendered Here -->
                    </div>
                </div>

                <div class="p-8 bg-slate-50 flex justify-end">
                    <button type="submit" id="btn-submit" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-0.5 flex items-center gap-2">
                        <span>Kirim Pendaftaran</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
