<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Siswa Baru - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">SD</div>
                    <a href="index.html" class="font-bold text-xl tracking-tight text-blue-900">SD INPRES LELINGLUAN</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-28 pb-20 px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mx-auto">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Formulir Pendaftaran</h1>
                <p class="text-slate-500">Lengkapi data di bawah ini dengan benar dan sesuai dokumen asli.</p>
            </div>

            <form id="form-daftar" class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">

                <!-- Section 1: Identity -->
                <div class="p-8 border-b border-slate-100">
                    <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                        <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm">1</span>
                        Data Pribadi Siswa
                    </h2>
                    <div id="section-identity" class="space-y-5">
                        <!-- Dynamic Content Rendered Here -->
                        <div class="animate-pulse space-y-4">
                            <div class="h-10 bg-slate-100 rounded w-full"></div>
                            <div class="h-10 bg-slate-100 rounded w-full"></div>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Parents -->
                <div class="p-8 border-b border-slate-100 bg-slate-50/50">
                    <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                        <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm">2</span>
                        Data Orang Tua / Wali
                    </h2>
                    <div id="section-parents" class="space-y-5">
                        <!-- Dynamic Content Rendered Here -->
                    </div>
                </div>

                <!-- Section 3: Files -->
                <div class="p-8 border-b border-slate-100">
                    <h2 class="text-xl font-bold text-slate-900 mb-6 flex items-center gap-2">
                        <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-sm">3</span>
                        Berkas Lampiran
                    </h2>
                    <div id="section-files" class="space-y-5">
                        <!-- Dynamic Content Rendered Here -->
                    </div>
                </div>

                <!-- Section 4: Custom/Additional -->
                <div class="p-8 border-b border-slate-100 bg-slate-50/50">
                    <div id="section-custom" class="space-y-5">
                        <!-- Dynamic Content Rendered Here -->
                    </div>
                </div>

                <!-- Submit -->
                <div class="p-8 bg-slate-50 flex justify-end">
                    <button type="submit" id="btn-submit" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition transform hover:-translate-y-0.5 flex items-center gap-2">
                        <span>Kirim Pendaftaran</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                    </button>
                </div>

            </form>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/daftar.js"></script>
</body>
</html>
