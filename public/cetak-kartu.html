<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Kartu Peserta - SD INPRES LELINGLUAN</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #e2e8f0; }
        .print-page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 10mm auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        @media print {
            body { background: none; margin: 0; }
            .print-page { margin: 0; width: 100%; box-shadow: none; padding: 0; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="no-print fixed top-4 right-4 z-50 flex gap-2">
        <button onclick="window.print()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 font-bold flex items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            Cetak / Simpan PDF
        </button>
        <button onclick="window.close()" class="bg-white text-slate-700 border border-slate-300 px-4 py-2 rounded shadow hover:bg-slate-50">
            Tutup
        </button>
    </div>

    <div class="print-page" id="card-container">
        <!-- Content Loaded via JS -->
        <div class="text-center pt-20 text-slate-400">Memuat data...</div>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                alert('ID Siswa tidak ditemukan');
                return;
            }

            try {
                // Fetch data & Settings
                const [studentRes, settingsRes] = await Promise.all([
                    supabaseClient.from('pendaftaran').select('*').eq('id', id).single(),
                    supabaseClient.from('app_settings').select('value').eq('key', 'school_profile').single()
                ]);

                if (studentRes.error) throw studentRes.error;
                const data = studentRes.data;

                // Parse Settings
                let school = {
                    nama_sekolah: 'SD INPRES LELINGLUAN',
                    alamat: 'Jl. Contoh No. 123, Desa Lelingluan, Kec. Tanimbar Utara',
                    kepala_sekolah: 'Admin Sekolah',
                    logo_url: ''
                };

                if (settingsRes.data && settingsRes.data.value) {
                    const saved = typeof settingsRes.data.value === 'string' ? JSON.parse(settingsRes.data.value) : settingsRes.data.value;
                    school = { ...school, ...saved };
                }

                // Get Photo URL
                let fotoUrl = 'https://via.placeholder.com/150';
                if (data.foto_url) {
                    const { data: signedData } = await supabaseClient.storage.from('berkas_siswa').createSignedUrl(data.foto_url, 3600);
                    if (signedData) fotoUrl = signedData.signedUrl;
                }

                // Render
                const date = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const regDate = new Date(data.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                const container = document.getElementById('card-container');

                // Logo Handling
                const logoImg = school.logo_url
                    ? `<img src="${school.logo_url}" class="w-20 h-20 object-contain">`
                    : `<div class="w-20 h-20 bg-blue-900 text-white flex items-center justify-center font-bold text-2xl rounded-full">SD</div>`;

                container.innerHTML = `
                    <div class="border-4 border-double border-slate-800 p-8 relative">
                        <!-- Header -->
                        <div class="flex items-center justify-between border-b-2 border-slate-800 pb-4 mb-6">
                            ${logoImg}
                            <div class="text-center flex-1 px-4">
                                <h1 class="text-2xl font-bold uppercase tracking-wider mb-1">Panitia Penerimaan Peserta Didik Baru</h1>
                                <h2 class="text-xl font-bold text-blue-900 uppercase">${school.nama_sekolah}</h2>
                                <p class="text-sm text-slate-600">${school.alamat}</p>
                            </div>
                            <div class="w-20"></div>
                        </div>

                        <div class="text-center mb-8">
                            <h3 class="text-xl font-bold underline decoration-2 underline-offset-4">KARTU TANDA BUKTI PENDAFTARAN</h3>
                            <p class="text-sm text-slate-500 mt-2 font-mono">NO. REG: <span class="text-lg font-bold text-black bg-yellow-100 px-2">${data.nik}</span></p>
                        </div>

                        <div class="flex gap-8 mb-8">
                            <!-- Photo -->
                            <div class="w-40 h-48 border-2 border-slate-300 bg-slate-100 flex-shrink-0">
                                <img src="${fotoUrl}" class="w-full h-full object-cover">
                            </div>

                            <!-- Details -->
                            <div class="flex-1 text-sm space-y-3">
                                <div class="grid grid-cols-3 border-b border-dotted border-slate-300 pb-1">
                                    <div class="font-bold text-slate-700">Nama Lengkap</div>
                                    <div class="col-span-2 uppercase font-semibold">: ${data.nama_lengkap}</div>
                                </div>
                                <div class="grid grid-cols-3 border-b border-dotted border-slate-300 pb-1">
                                    <div class="font-bold text-slate-700">NIK</div>
                                    <div class="col-span-2">: ${data.nik}</div>
                                </div>
                                <div class="grid grid-cols-3 border-b border-dotted border-slate-300 pb-1">
                                    <div class="font-bold text-slate-700">Tempat, Tgl Lahir</div>
                                    <div class="col-span-2">: ${data.tempat_lahir}, ${new Date(data.tanggal_lahir).toLocaleDateString('id-ID')}</div>
                                </div>
                                <div class="grid grid-cols-3 border-b border-dotted border-slate-300 pb-1">
                                    <div class="font-bold text-slate-700">Jenis Kelamin</div>
                                    <div class="col-span-2">: ${data.jenis_kelamin}</div>
                                </div>
                                <div class="grid grid-cols-3 border-b border-dotted border-slate-300 pb-1">
                                    <div class="font-bold text-slate-700">Asal Sekolah</div>
                                    <div class="col-span-2">: ${data.asal_sekolah || '-'}</div>
                                </div>
                                <div class="grid grid-cols-3 border-b border-dotted border-slate-300 pb-1">
                                    <div class="font-bold text-slate-700">Tanggal Daftar</div>
                                    <div class="col-span-2">: ${regDate}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Footer / Signature -->
                        <div class="flex justify-between items-start mt-12 pt-8">
                            <div class="text-center w-64">
                                <p class="text-sm mb-16">Siswa Pendaftar,</p>
                                <p class="font-bold border-b border-slate-400 inline-block px-4">${data.nama_lengkap}</p>
                            </div>
                            <div class="text-center w-64">
                                <p class="text-sm mb-2">Lelingluan, ${date}</p>
                                <p class="text-sm mb-12">Kepala Sekolah,</p>
                                <p class="font-bold border-b border-slate-400 inline-block px-4">${school.kepala_sekolah}</p>
                            </div>
                        </div>

                        <div class="mt-12 p-4 bg-slate-50 border border-slate-200 text-xs text-slate-500 rounded text-center italic">
                            * Kartu ini adalah bukti sah pendaftaran. Harap dibawa saat proses verifikasi ulang.
                            <br>
                            * Cek status kelulusan secara berkala di website resmi sekolah.
                        </div>
                    </div>
                `;

                // Auto print after small delay? No, user can click button.

            } catch (err) {
                console.error(err);
                document.getElementById('card-container').innerHTML = `<div class="text-red-500 text-center p-10">Gagal memuat data: ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
